# .github/workflows/generate-points-snapshot.yml
#
# Workflow: Generate Points Snapshot
#
# Exports all point documents from the Firestore 'points' collection plus
# server-side clustered map markers to a single JSON file (points/points.json)
# in Firebase Storage. The planning map page fetches this file on load instead
# of paginating through Firestore and clustering on-device.
#
# Required secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT: JSON string of a Firebase service account key
#     with the following permissions on the roots-eddf5 project:
#       - Cloud Datastore User (Firestore read access)
#       - Storage Object Admin (Firebase Storage write access)
#
# Triggers:
#   - Manual: Actions tab > "Generate Points Snapshot" > Run workflow
#   - Automatic: Send a repository_dispatch event with type "regenerate-points"
#
# Run this workflow whenever you add, edit, or delete points in Firebase so
# the snapshot stays in sync with Firestore.

name: Generate Points Snapshot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [regenerate-points]

# Shared across all four data-refresh workflows so overlapping runs (nightly
# Strava fetch, weekly facilities fetch, manual tile/point regen) queue
# instead of racing on `git push` to main.
concurrency:
  group: repo-data-refresh
  cancel-in-progress: false

jobs:
  generate-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      - name: Generate and upload points snapshot
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node generate-points-snapshot.js

      - name: Commit updated points snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # turkey-/taiwan-points.json only get written once that country has
          # at least one point in Firestore (see COUNTRY_SNAPSHOTS in
          # generate-points-snapshot.js) — `git add` on a path that doesn't
          # exist yet fails the whole step, so guard each optional file.
          git add assets/points.json assets/norway-points.json assets/denmark-points.json
          for f in assets/turkey-points.json assets/taiwan-points.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "chore: update points snapshots [skip ci]"
          git pull --rebase
          git push
