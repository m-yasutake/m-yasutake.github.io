<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tomika Bike – Gear list and specs for our cycling adventure." />
  <title>Gear – Tomika Bike</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚴</text></svg>" />

  <style>
    .gear-grid { display: block; }

    .gear-category {
      background: var(--color-white);
      border-radius: 0;
      border: 1px solid var(--color-gray-200);
      box-shadow: none;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .gear-category-header {
      background: var(--color-primary);
      color: var(--color-white);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .gear-category-header h3 { margin: 0; font-size: 1rem; font-weight: 500; letter-spacing: 0.04em; }
    .gear-category-icon { font-size: 1.25rem; }

    .gear-table {
      width: 100%;
      border-collapse: collapse;
    }

    .gear-table th {
      background: var(--color-gray-100);
      color: var(--color-primary);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.6rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--color-gray-200);
    }

    .gear-table td {
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--color-gray-100);
      vertical-align: middle;
    }

    .gear-table tr:last-child td { border-bottom: none; }
    .gear-table tr:hover td { background: rgba(91,140,107,0.05); }

    .gear-notes {
      color: var(--color-gray-600);
      font-size: 0.82rem;
      font-style: italic;
    }

    /* ── Mobile-responsive gear tables ──────────────────── */
    @media (max-width: 600px) {
      .gear-category { overflow-x: visible; }
      .gear-table thead { display: none; }
      .gear-table tbody tr {
        display: block;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--color-gray-200);
      }
      .gear-table tbody tr:last-child { border-bottom: none; }
      .gear-table tbody td {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.25rem 0;
        border-bottom: none;
        font-size: 0.875rem;
        gap: 0.5rem;
      }
      .gear-table tbody td::before {
        content: attr(data-label);
        font-weight: 600;
        color: var(--color-primary);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        flex-shrink: 0;
        min-width: 4rem;
      }
      .gear-table tbody td:not([data-label]) { display: none; }
    }

    .gear-group-header td {
      background: var(--color-gray-100);
      font-weight: 700;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-primary);
      padding: 0.4rem 1rem;
    }

    /* ── Bike Setup Photos ───────────────────────────────── */
    .bike-setups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 600px) { .bike-setups { grid-template-columns: 1fr; } }
    .bike-setup-card {
      background: var(--color-white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-gray-200);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      text-align: center;
    }
    .bike-setup-img {
      width: 100%;
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, var(--color-gray-100), var(--color-gray-200));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.5rem;
      color: var(--color-gray-500);
    }
    .bike-setup-img .placeholder-icon { font-size: 4rem; }
    .bike-setup-img .placeholder-text { font-size: 0.85rem; font-style: italic; }
    .bike-setup-label {
      padding: 0.75rem 1rem;
      font-weight: 600;
      font-size: 1rem;
      color: var(--color-primary);
      font-family: var(--font-heading);
    }
    .bike-setup-rig { margin: 0 1rem 1rem; text-align: left; }
  </style>
</head>
<body>

<!-- Page Loader -->
<div class="page-loader">

    <div class="loader-logo">tomika<span class="accent">.bike</span></div>

      Continue with Google
    </button>
    <p class="auth-note">Firebase auth coming soon</p>
  </div>
</div>

<!-- Page Hero -->
<div class="page-hero">
  <div class="container">
    <div class="hero-badge" style="margin-bottom:.75rem" data-i18n="gear.badge">🎒 Gear &amp; Packing</div>
    <h1 data-i18n="gear.title">Gear List</h1>
    <p data-i18n="gear.subtitle">Everything we're bringing on the road – gear list and specs for both bikes.</p>

<!-- ══════════════════════════════════════════

════════════════════════════════════════════ -->
<section class="section" style="padding-top:2rem">
  <div class="container">
    <div class="gear-grid">

      <!-- Left: Gear Tables (rendered by JS) -->
      <div>

        <!-- Bike Setup Photos -->
        <div class="bike-setups">
          <div class="bike-setup-card" data-rig="mika">
            <div class="bike-setup-img" id="bike-setup-img-mika">
              <span class="placeholder-icon" role="img" aria-label="Bicycle">🚲</span>
              <span class="placeholder-text" data-i18n="gear.photo.soon">Photo coming soon</span>
            </div>
            <div class="bike-setup-label" data-i18n="gear.mika.bike">Mika's Rig</div>
            <div class="bike-setup-rig" id="rigMika"></div>
          </div>
          <div class="bike-setup-card" data-rig="tom">
            <div class="bike-setup-img" id="bike-setup-img-tom">
              <span class="placeholder-icon" role="img" aria-label="Bicycle">🚲</span>
              <span class="placeholder-text" data-i18n="gear.photo.soon">Photo coming soon</span>
            </div>
            <div class="bike-setup-label" data-i18n="gear.tom.bike">Tom's Rig</div>
            <div class="bike-setup-rig" id="rigTom"></div>
          </div>
        </div>

        <!-- Gear tables injected here, rendered from the GEAR_DEFAULT data below -->
        <div id="gearContent">
          <p style="padding:2rem;color:var(--color-gray-600)" data-i18n="gear.loading">Loading gear list…</p>
        </div>

      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/site-nav.js"></script>
<script>SiteNav.init();</script>
<script src="js/site-footer.js"></script>
<script>SiteFooter.init();</script>
<script src="js/main.js"></script>
<script>
// ── Gear List Manager ─────────────────────────────────────────
(function () {
  let _fsLoaded = false;

  // ── Default / seed data (edited here in code, not through admin.html) ──
  const GEAR_DEFAULT = [
    { id: 'mika-rig', icon: '🚲', name: "Mika's Rig", order: 0, items: [
      { id: 'mr1', name: '2021 Opus Horizon AL Apex 1 650', notes: 'Aluminum frame, full carbon fork · FSA Orbit headset · 27.5", 48mm tires', group: 'Bike' },
      { id: 'mr2', name: 'SRAM Apex 1x11 drivetrain', notes: '11-46 cassette × Shimano CUES 26T/40T chainring · SRAM Apex 1 long-cage rear derailleur', group: 'Drivetrain' },
      { id: 'mr3', name: 'Alex VXD4 tubeless-ready rims', notes: 'Alex through-axle hubs (12mm)', group: 'Wheels & Brakes' },
      { id: 'mr4', name: 'Promax Decode R disc brakes', notes: 'Flat-mount, twin-piston', group: 'Wheels & Brakes' },
      { id: 'mr5', name: 'Axiom Streamliner Disc DLX rack', notes: '', group: 'Mounts' },
      { id: 'mr6', name: 'Blackburn Outpost fork cages', notes: '', group: 'Mounts' },
      { id: 'mr7', name: 'Ortlieb Back-Roller Classic 20L', notes: 'Pannier', group: 'Bags' },
      { id: 'mr8', name: 'Rhinowalk 22L Waterproof Bicycle Pannier Backpack', notes: 'With laptop sleeve', group: 'Bags' },
      { id: 'mr9', name: 'DIY framebag', notes: '', group: 'Bags' },
      { id: 'mr10', name: 'DIY stem feedbag', notes: '', group: 'Bags' },
      { id: 'mr11', name: 'Sea to Summit drybags', notes: '', group: 'Bags' },
      { id: 'mr12', name: 'NinetyK Yes saddle', notes: 'Opus Siver seatpost (27.2×300)', group: 'Comfort' },
      { id: 'mr13', name: 'X-Race Aero handlebars', notes: '16° flare · Opus Gold stem · Velo VexGel diamond grip tape', group: 'Comfort' },
      { id: 'mr14', name: 'Da Brim helmet shade', notes: '', group: 'Comfort' },
    ]},
    { id: 'tom-rig', icon: '🚲', name: "Tom's Rig", order: 1, items: [
      { id: 'tr1', name: '2019 Kona Unit', notes: 'Reynolds 520 butted cromoly steel frame · Kona Plus rigid fork · 27.5" wheels, 2–3" tyres', group: 'Bike' },
      { id: 'tr2', name: 'Shimano Deore XT drivetrain', notes: '11-46 cassette × 32T chainring', group: 'Drivetrain' },
      { id: 'tr3', name: 'SON dynamo hub', notes: '', group: 'Power' },
      { id: 'tr4', name: 'Sinewave Beacon', notes: 'Dynamo-powered headlight / USB charger', group: 'Power' },
      { id: 'tr5', name: 'WTB ST i35 TCS rims', notes: 'Formula hubs · WTB Ranger TCS 27.5×2.8" tires', group: 'Wheels & Brakes' },
      { id: 'tr6', name: 'Tektro HDM275 hydraulic disc brakes', notes: '180mm rotors', group: 'Wheels & Brakes' },
      { id: 'tr7', name: 'Old Man Mountain rear rack', notes: '', group: 'Mounts' },
      { id: 'tr8', name: 'Blackburn Outpost fork cages', notes: '', group: 'Mounts' },
      { id: 'tr9', name: 'Ortlieb Back-Roller Classic 20L', notes: 'Pannier', group: 'Bags' },
      { id: 'tr10', name: 'Ortlieb Vario 20L', notes: 'Pannier', group: 'Bags' },
      { id: 'tr11', name: 'DIY framebag', notes: '', group: 'Bags' },
      { id: 'tr12', name: 'Sea to Summit drybags', notes: '', group: 'Bags' },
      { id: 'tr13', name: 'Brooks B17 saddle', notes: '', group: 'Comfort' },
      { id: 'tr14', name: 'Surly Moloko handlebars', notes: 'Kona XC/BC stem · Kona Key Grip grips', group: 'Comfort' },
      { id: 'tr15', name: 'Kona JS2 pedals', notes: '', group: 'Comfort' },
      { id: 'tr16', name: 'Da Brim helmet shade', notes: '', group: 'Comfort' },
    ]},
    { id: 'shelter-sleep', icon: '🛏️', name: 'Shelter & Sleep', order: 2, items: [
      { id: 'ss1', name: 'Tent (2-person)', notes: 'Main shelter', group: '' },
      { id: 'ss2', name: 'Sleeping bags', notes: 'Down bags for cool nights', group: '' },
      { id: 'ss3', name: 'Sleeping mats', notes: 'Compact inflatable mats', group: '' },
    ]},
    { id: 'cooking-eating', icon: '🍳', name: 'Cooking & Eating', order: 3, items: [
      { id: 'ce1', name: 'Cooking stove + fuel', notes: 'Primary cooking setup', group: '' },
      { id: 'ce2', name: 'Cook pot + pan', notes: 'Simple camp cooking set', group: '' },
      { id: 'ce3', name: 'Mugs, bowls and utensils', notes: 'Shared meal kit', group: '' },
    ]},
    { id: 'clothing', icon: '👕', name: 'Clothing', order: 4, items: [
      { id: 'cl1', name: 'Cycling jerseys (×3)', notes: 'Merino wool preferred', group: '' },
      { id: 'cl2', name: 'Bib shorts / shorts (×2)', notes: '', group: '' },
      { id: 'cl3', name: 'Rain jacket', notes: 'Lightweight packable', group: '' },
    ]},
    { id: 'nav-tech', icon: '📡', name: 'Navigation & Tech', order: 5, items: [
      { id: 'nt1', name: 'GPS device', notes: 'Garmin Edge', group: '' },
      { id: 'nt2', name: 'Camera', notes: '', group: '' },
      { id: 'nt3', name: 'Laptop', notes: 'For blog & work on the road', group: '' },
    ]},
    { id: 'bike-maintenance', icon: '🔧', name: 'Bike Maintenance', order: 6, items: [
      { id: 'bm1', name: 'Repair kit & multi-tool', notes: '', group: '' },
      { id: 'bm2', name: 'Spare tubes (×4)', notes: '700×35c', group: '' },
    ]},
    { id: 'extras', icon: '✨', name: 'Extras & Luxuries', order: 7, items: [
      { id: 'ex1', name: 'Coffee dripper', notes: '', group: '' },
      { id: 'ex2', name: 'Small sketchbook', notes: '', group: '' },
    ]},
  ];

  // ── Firestore helper (bike photos/links only — see loadBikeLinks) ──
  async function ensureFirestore() {
    if (_fsLoaded) return;
    await window.TomikaBikes.ensureFirebaseAuth();
    await new Promise((resolve, reject) => {
      const ver = '10.12.2';
      const src = 'https://www.gstatic.com/firebasejs/' + ver + '/firebase-firestore-compat.js';
      if ([...document.scripts].some(s => s.getAttribute('src') === src)) { resolve(); return; }
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
    _fsLoaded = true;
  }

  // ── Rendering ─────────────────────────────────────────────
  const RIG_IDS = new Set(['mika-rig', 'tom-rig']);

  function renderCategory(cat, includeHeader = true) {
    const isRig = RIG_IDS.has(cat.id);

    let html = '<div class="gear-category">';
    if (includeHeader) {
      html += '<div class="gear-category-header">';
      html += '<span class="gear-category-icon">' + cat.icon + '</span>';
      html += '<h3>' + cat.name + '</h3>';
      html += '</div>';
    }

    html += '<table class="gear-table"><thead><tr><th>Item</th><th>Notes</th></tr></thead><tbody>';

    let lastGroup = null;
    cat.items.forEach(item => {
      const grp = item.group || '';
      if (isRig && grp && grp !== lastGroup) {
        lastGroup = grp;
        html += '<tr class="gear-group-header"><td colspan="2" class="gear-group-label">' + grp + '</td></tr>';
      }
      html += '<tr>';
      html += '<td data-label="Item">' + (item.name || '') + '</td>';
      html += '<td data-label="Notes" class="gear-notes">' + (item.notes || '') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  function renderGear(data) {
    const content = document.getElementById('gearContent');
    const rigMika = document.getElementById('rigMika');
    const rigTom  = document.getElementById('rigTom');
    if (!content || !rigMika || !rigTom) return;

    const mikaCat = data.find(cat => cat.id === 'mika-rig');
    const tomCat  = data.find(cat => cat.id === 'tom-rig');
    const rest    = data.filter(cat => cat.id !== 'mika-rig' && cat.id !== 'tom-rig');

    rigMika.innerHTML = mikaCat ? renderCategory(mikaCat, false) : '';
    rigTom.innerHTML  = tomCat  ? renderCategory(tomCat,  false) : '';

    let html = '';
    rest.forEach(cat => { html += renderCategory(cat, true); });
    content.innerHTML = html;
  }

  // ── Init ──────────────────────────────────────────────────
  async function init() {
    try {
      await window.TomikaBikes.ensureFirebaseAuth();
      await ensureFirestore();
      await loadBikeLinks();
    } catch (e) {
      console.warn('Gear: bike links unavailable:', e);
    }
    renderGear(GEAR_DEFAULT);
  }

  // ── Load bike links and photos from Firestore ────────────────
  async function loadBikeLinks() {
    try {
      const doc = await firebase.firestore().collection('site_config').doc('gear').get();
      if (!doc.exists) return;
      const d = doc.data();
      const bikeConfig = {
        mika: { label: "Mika's Rig", url: d.mikaBikeUrl, photo: d.mikaBikePhoto, imgId: 'bike-setup-img-mika' },
        tom:  { label: "Tom's Rig",  url: d.tomBikeUrl,  photo: d.tomBikePhoto,  imgId: 'bike-setup-img-tom' },
      };
      document.querySelectorAll('.bike-setup-card').forEach(card => {
        const label = card.querySelector('.bike-setup-label');
        if (!label) return;
        const config = bikeConfig[card.dataset.rig];
        if (!config) return;
        // Apply photo if available
        if (config.photo && /^https?:\/\//.test(config.photo)) {
          const imgEl = document.getElementById(config.imgId);
          if (imgEl) {
            imgEl.innerHTML = '';
            const img = document.createElement('img');
            img.src   = config.photo;
            img.alt   = config.label;
            img.style.cssText = 'width:100%;height:100%;object-fit:cover';
            imgEl.appendChild(img);
          }
        }
        // Apply URL link if available
        const url = config.url;
        if (url && /^https?:\/\//.test(url)) {
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.style.cssText = 'color:var(--color-primary);text-decoration:none';
          a.textContent = config.label;
          const icon = document.createElement('span');
          icon.style.cssText = 'font-size:.75em;vertical-align:middle;margin-left:.25em';
          icon.textContent = '🔗';
          a.appendChild(icon);
          label.textContent = '';
          label.appendChild(a);
        }
      });
    } catch (e) { console.warn('Gear: bike photos failed to load:', e.message || e); }
  }

  init();
})();
</script>

</html>
